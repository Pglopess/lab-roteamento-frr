frr defaults traditional
hostname r5
service integrated-vtysh-config
!
interface lo
ip address 10.255.0.5/32
ip ospf area 0
!
interface eth1
description para-r2
ip address 10.0.25.2/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth2
description para-r4
ip address 10.0.45.2/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
! Rede de acesso (LAN do h5): anunciada, mas passiva (sem Hellos para o host).
interface eth3
description lan-h5
ip address 192.168.5.1/24
ip ospf area 0
ip ospf passive
!
router ospf
ospf router-id 10.255.0.5
!
