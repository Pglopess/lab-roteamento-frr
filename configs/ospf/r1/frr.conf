frr defaults traditional
hostname r1
service integrated-vtysh-config
!
! Loopback: identidade estável do roteador e destino dos testes de ping.
interface lo
ip address 10.255.0.1/32
ip ospf area 0
!
! Links ponto a ponto: sem eleição de DR/BDR, adjacência mais rápida.
! Custo fixo 10 em todos os links: a métrica vira contagem de saltos x10,
! independente da "velocidade" que o kernel reporta para as veth.
interface eth1
description para-r2
ip address 10.0.12.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth2
description para-r3
ip address 10.0.13.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
! Rede de acesso (LAN do h1): anunciada, mas passiva (sem Hellos para o host).
interface eth3
description lan-h1
ip address 192.168.1.1/24
ip ospf area 0
ip ospf passive
!
! Área única (backbone): domínio OSPF plano com os 5 roteadores.
router ospf
ospf router-id 10.255.0.1
!
