frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
ip address 10.255.0.2/32
ip ospf area 0
!
interface eth1
description para-r1
ip address 10.0.12.2/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth2
description para-r4
ip address 10.0.24.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth3
description para-r5
ip address 10.0.25.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
router ospf
ospf router-id 10.255.0.2
!
