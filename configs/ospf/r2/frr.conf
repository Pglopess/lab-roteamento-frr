frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
ip address 10.255.0.2/32
ip ospf area 0
!
interface eth1
description para-r1
ip address 10.0.12.2/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth2
description para-r4
ip address 10.0.24.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth3
description para-r5
ip address 10.0.25.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
! Rede de acesso (LAN do h2): anunciada, mas passiva (sem Hellos para o host).
interface eth4
description lan-h2
ip address 192.168.2.1/24
ip ospf area 0
ip ospf passive
!
router ospf
ospf router-id 10.255.0.2
!
