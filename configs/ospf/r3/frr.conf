frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
ip address 10.255.0.3/32
ip ospf area 0
!
interface eth1
description para-r1
ip address 10.0.13.2/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
interface eth2
description para-r4
ip address 10.0.34.1/30
ip ospf area 0
ip ospf network point-to-point
ip ospf cost 10
!
router ospf
ospf router-id 10.255.0.3
!
