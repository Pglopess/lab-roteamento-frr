frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description para-r2
 ip address 10.0.12.1/30
!
interface eth2
 description para-r3
 ip address 10.0.13.1/30
!
! BGP: sem IGP. iBGP pelo link direto com next-hop-self.
! 'no bgp ebgp-requires-policy': sem isso o FRR nao troca prefixos via eBGP.
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.13.2 remote-as 65002
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor 10.0.12.2 next-hop-self
 exit-address-family
!
