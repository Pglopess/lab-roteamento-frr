frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
interface eth1
 description para-r2
 ip address 10.0.24.2/30
!
interface eth2
 description para-r3
 ip address 10.0.34.2/30
!
interface eth3
 description para-r5
 ip address 10.0.45.1/30
!
! BGP: sem IGP. iBGP pelo link direto com next-hop-self.
! 'no bgp ebgp-requires-policy': sem isso o FRR nao troca prefixos via eBGP.
router bgp 65002
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 neighbor 10.0.24.1 remote-as 65001
 neighbor 10.0.34.1 remote-as 65002
 neighbor 10.0.45.2 remote-as 65003
 address-family ipv4 unicast
  network 10.255.0.4/32
  neighbor 10.0.34.1 next-hop-self
 exit-address-family
!
