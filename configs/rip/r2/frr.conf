frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description para-r1
 ip address 10.0.12.2/30
!
interface eth2
 description para-r4
 ip address 10.0.24.1/30
!
interface eth3
 description para-r5
 ip address 10.0.25.1/30
!
! RIPv2: anuncia os links (10.0.0.0/16) e os loopbacks (10.255.0.0/24).
! Métrica = contagem de saltos. Timers padrão FRR: update 30s, timeout 180s, garbage 120s.
router rip
 version 2
 network 10.0.0.0/16
 network 10.255.0.0/24
 redistribute connected
!
