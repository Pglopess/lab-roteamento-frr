frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description para-r1
 ip address 10.0.12.2/30
!
interface eth2
 description para-r4
 ip address 10.0.24.1/30
!
interface eth3
 description para-r5
 ip address 10.0.25.1/30
!
! Rede de acesso (LAN do h2)
interface eth4
 description lan-h2
 ip address 192.168.2.1/24
!
! RIPv2: anuncia os links (10.0.0.0/16), os loopbacks (10.255.0.0/24) e a LAN (passiva).
! Métrica = contagem de saltos. Timers padrão FRR: update 30s, timeout 180s, garbage 120s.
router rip
 version 2
 network 10.0.0.0/16
 network 10.255.0.0/24
 network 192.168.2.0/24
 passive-interface eth4
 redistribute connected
!
